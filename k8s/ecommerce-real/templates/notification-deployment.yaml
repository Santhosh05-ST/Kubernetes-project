apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service

spec:
  replicas: {{ .Values.notificationService.replicaCount }}

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "notification_db"

            - name: DB_USERNAME
              value: "{{ .Values.postgres.username }}"

            - name: DB_PASSWORD
              value: "{{ .Values.postgres.password }}"