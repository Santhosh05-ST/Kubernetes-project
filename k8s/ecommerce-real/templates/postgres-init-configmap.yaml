apiVersion: v1
kind: ConfigMap

metadata:
  name: postgres-init-script

data:
  01-create-databases.sh: |
    #!/bin/bash
    set -e

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
      CREATE DATABASE product_db;
      CREATE DATABASE order_db;
      CREATE DATABASE notification_db;
    EOSQL