apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service

spec:
  replicas: {{ .Values.orderService.replicaCount }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"
          imagePullPolicy: {{ .Values.orderService.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8080

          env:
            - name: DB_HOST
              value: "postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "order_db"

            - name: DB_USERNAME
              value: {{ .Values.postgres.username | quote }}

            - name: DB_PASSWORD
              value: {{ .Values.postgres.password | quote }}